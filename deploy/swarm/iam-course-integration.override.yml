# 与课程项目管理系统（course-project-mgt）联调时的 Swarm 覆盖配置。
# 1. 将 IAM 后端（app / oop）与 MySQL 同时接入课程栈使用的外部 javaee-proxy 网络：
#    - 课程后端可通过 http://polyauth-app:8080/api/v1 或 http://polyauth-oop:8080/api/v1 内网直连 IAM；
#    - 课程后端可直接复用 mysql:3306 中的 course_project 库，无需再起第二个 MySQL。
# 2. 支持通过 IAM_APP_IMAGE / IAM_OOP_IMAGE 环境变量覆盖双后端镜像版本。
#
# 用法：
#   docker network inspect javaee-proxy >/dev/null 2>&1 || \
#     docker network create --driver overlay --attachable javaee-proxy
#   export CORS_ALLOWED_ORIGINS="*"
#   docker stack deploy -c iam-stack.yml -c iam-course-integration.override.yml --with-registry-auth iam

version: "3.8"

networks:
  javaee-proxy:
    external: true

services:
  mysql:
    networks:
      iam-net:
        aliases: [mysql]
      javaee-proxy:
        aliases: [mysql]

  app:
    image: ${IAM_APP_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ooad-mytx/iam-app:1.0.2}
    networks:
      iam-net:
        aliases: [app]
      javaee-proxy:
        aliases: [polyauth-app]

  oop:
    image: ${IAM_OOP_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ooad-mytx/iam-oop-app:1.0.2}
    networks:
      iam-net:
        aliases: [oop]
      javaee-proxy:
        aliases: [polyauth-oop]
