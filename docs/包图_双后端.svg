<rect x="180" y="468" width="830" height="164" rx="6" fill="#ffffff" stroke="#29445f" stroke-width="1.7"/>
<text x="258.5" y="457" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#172033">application</text>
<rect x="198" y="484" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="502" font-size="13.5" fill="#25384d">auth / account / organization：认证会话、账号与组织过程</text>
<rect x="198" y="517" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="535" font-size="13.5" fill="#25384d">role / permission / api / system：角色、权限、接口与系统管理</text>
<rect x="198" y="550" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="568" font-size="13.5" fill="#25384d">decision / identity / openapi / log：鉴权决策、统一身份与审计日志</text>
<rect x="198" y="583" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="601" font-size="13.5" fill="#25384d">expiration / idempotency：过期清理与幂等控制（线性过程与事务边界）</text>
