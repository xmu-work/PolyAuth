<rect x="180" y="1058" width="830" height="164" rx="6" fill="#ffffff" stroke="#29445f" stroke-width="1.7"/>
<text x="248.0" y="1047" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#172033">common</text>
<rect x="198" y="1074" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="1092" font-size="13.5" fill="#25384d">result：Result / PageResult 统一响应包装</text>
<rect x="198" y="1107" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="1125" font-size="13.5" fill="#25384d">exception：BusinessException / GlobalExceptionHandler</text>
<rect x="198" y="1140" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="1158" font-size="13.5" fill="#25384d">enums：ErrorCode、AccountStatus、OrgType、RoleType、OperationAction</text>
<rect x="198" y="1173" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="1191" font-size="13.5" fill="#25384d">公共契约与基础规则（被 interfaces / application / infrastructure 共用）</text>
<path d="M1230,176 H1364 Q1376,176 1376,188 V210 H1230 Z" fill="#dceaf8" stroke="#29445f" stroke-width="1.7"/>
<rect x="1230" y="210" width="830" height="130" rx="6" fill="#ffffff" stroke="#29445f" stroke-width="1.7"/>
<text x="1303.0" y="199" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#172033">interfaces</text>
<rect x="1248" y="226" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="244" font-size="13.5" fill="#25384d">controller：AuthController、RoleController、IdentityAuthController 等</text>
<rect x="1248" y="259" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="277" font-size="13.5" fill="#25384d">dto / vo / common / openapi：入参 DTO、响应 VO 与统一错误结构</text>
<rect x="1248" y="292" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="310" font-size="13.5" fill="#25384d">filter / advice / security：拦截器、全局异常处理与幂等过滤</text>
<path d="M1230,434 H1375 Q1387,434 1387,446 V468 H1230 Z" fill="#dceaf8" stroke="#29445f" stroke-width="1.7"/>
<rect x="1230" y="468" width="830" height="164" rx="6" fill="#ffffff" stroke="#29445f" stroke-width="1.7"/>
<text x="1308.5" y="457" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#172033">application</text>
<rect x="1248" y="484" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="502" font-size="13.5" fill="#25384d">command / result / exception：用例命令、结果模型与应用错误码</text>
<rect x="1248" y="517" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="535" font-size="13.5" fill="#25384d">usecase：认证、角色、账号、组织、权限查询与统一身份编排</text>
<rect x="1248" y="550" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="568" font-size="13.5" fill="#25384d">port：JWT、密码、审计、加密、幂等与防重放输出端口接口</text>
