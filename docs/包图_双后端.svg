<text x="116" y="822" text-anchor="end" font-size="13" font-weight="normal" fill="#45586d">各层共用</text>
<text x="116" y="842" text-anchor="end" font-size="13" font-weight="normal" fill="#45586d">common</text>
<path d="M1645,340 L1645,467" fill="none" stroke="#5b6f86" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow)"/>
<text x="1661" y="409" text-anchor="start" font-size="13" font-weight="normal" fill="#45586d">interfaces → application</text>
<path d="M1645,632 L1645,759" fill="none" stroke="#5b6f86" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow)"/>
<text x="1661" y="701" text-anchor="start" font-size="13" font-weight="normal" fill="#45586d">application → domain</text>
<path d="M1645,1058 L1645,925" fill="none" stroke="#1d6b52" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow-dip)"/>
<text x="1661" y="989" text-anchor="start" font-size="13" font-weight="bold" fill="#195c46">infrastructure → domain</text>
<text x="1661" y="1009" text-anchor="start" font-size="13" font-weight="bold" fill="#195c46">（依赖倒置：实现 domain.repository）</text>
<path d="M2060,1140 L2112,1140 L2112,563 L2061,563" fill="none" stroke="#1d6b52" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow-dip)"/>
<text x="2126" y="818" text-anchor="start" font-size="13" font-weight="bold" fill="#195c46">infrastructure →</text>
<text x="2126" y="838" text-anchor="start" font-size="13" font-weight="bold" fill="#195c46">application.port</text>
<text x="2126" y="858" text-anchor="start" font-size="13" font-weight="bold" fill="#195c46">（实现输出端口）</text>
<rect x="80" y="1272" width="2240" height="126" rx="8" fill="#f7fafc" stroke="#cbd7e3" stroke-width="1.3"/>
<line x1="120" y1="1300" x2="178" y2="1300" stroke="#5b6f86" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow)"/>
<text x="192" y="1305" text-anchor="start" font-size="13.5" font-weight="normal" fill="#45586d">常规单向依赖（编译期 import 方向）</text>
<line x1="470" y1="1300" x2="528" y2="1300" stroke="#1d6b52" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#package-arrow-dip)"/>
<text x="542" y="1305" text-anchor="start" font-size="13.5" font-weight="bold" fill="#195c46">依赖倒置（infrastructure 反向实现 domain.repository 与 application.port）</text>
<text x="120" y="1338" text-anchor="start" font-size="14" font-weight="normal" fill="#25384d">架构对比：结构化后端沿 interfaces → application → infrastructure → common 向下编排过程，业务规则集中在 Service；OOP 后端沿 interfaces → application → domain 逐层收敛，由 infrastructure 反向适配。</text>
<text x="120" y="1370" text-anchor="start" font-size="13.5" font-weight="normal" fill="#526579">编译期约束：UML 包图虚线箭头指向被依赖方；OOP 的 domain 层不依赖 Spring / JPA / JWT，避免持久化与安全框架反向侵入核心领域规则。</text></svg>
