<text x="210" y="244" font-size="13.5" fill="#25384d">admin：Controller、DTO、VO（认证、账号、组织、角色、权限、接口、系统、日志）</text>
<rect x="198" y="259" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="277" font-size="13.5" fill="#25384d">identity / openapi：统一身份契约与开放接口入口</text>
<rect x="198" y="292" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="310" font-size="13.5" fill="#25384d">AuthInterceptor、OpenApiAuthInterceptor、IdempotencyFilter、RequestIdFilter</text>
