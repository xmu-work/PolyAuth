<text x="1260" y="601" font-size="13.5" fill="#25384d">编排用例流程，仅依赖 domain 与自身 port 抽象</text>
<path d="M1230,726 H1354 Q1366,726 1366,738 V760 H1230 Z" fill="#e3f4e8" stroke="#29445f" stroke-width="1.7"/>
<rect x="1230" y="760" width="830" height="164" rx="6" fill="#ffffff" stroke="#29445f" stroke-width="1.7"/>
<text x="1298.0" y="749" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#172033">domain</text>
<rect x="1248" y="776" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="794" font-size="13.5" fill="#25384d">model：Role、RoleGrant、UserAccount、Organization 等领域模型</text>
<rect x="1248" y="809" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="827" font-size="13.5" fill="#25384d">service：RoleHierarchy、PermissionResolver 领域服务</text>
<rect x="1248" y="842" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="860" font-size="13.5" fill="#25384d">repository：纯领域仓储接口（只接收并返回领域对象）</text>
<rect x="1248" y="875" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="893" font-size="13.5" fill="#25384d">exception：领域规则异常（不依赖 Spring / JPA / interfaces）</text>
<path d="M1230,1024 H1408 Q1420,1024 1420,1036 V1058 H1230 Z" fill="#f8eddc" stroke="#29445f" stroke-width="1.7"/>
<rect x="1230" y="1058" width="830" height="164" rx="6" fill="#ffffff" stroke="#29445f" stroke-width="1.7"/>
<text x="1325.0" y="1047" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#172033">infrastructure</text>
<rect x="1248" y="1074" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="1092" font-size="13.5" fill="#25384d">persistence.entity / mapper / repository / adapter：JPA 持久化适配</text>
<rect x="1248" y="1107" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="1125" font-size="13.5" fill="#25384d">crypto：AES 姓名加密、PBKDF2 口令校验、HMAC 令牌摘要</text>
<rect x="1248" y="1140" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="1158" font-size="13.5" fill="#25384d">security / cache / logging：JWT 签发、本地幂等与防重放、切面日志</text>
<rect x="1248" y="1173" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="1260" y="1191" font-size="13.5" fill="#25384d">实现 domain.repository 与 application.port（反向适配领域与用例）</text>
<path d="M595,340 L595,467" fill="none" stroke="#5b6f86" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow)"/>
<text x="611" y="409" text-anchor="start" font-size="13" font-weight="normal" fill="#45586d">interfaces → application</text>
<path d="M595,632 L595,759" fill="none" stroke="#5b6f86" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow)"/>
<text x="611" y="701" text-anchor="start" font-size="13" font-weight="normal" fill="#45586d">application → infrastructure</text>
<path d="M595,924 L595,1057" fill="none" stroke="#5b6f86" stroke-width="1.9" stroke-dasharray="8,5" marker-end="url(#package-arrow)"/>
<text x="611" y="996" text-anchor="start" font-size="13" font-weight="normal" fill="#45586d">infrastructure → common</text>
<path d="M180,275 H128 M180,550 H128" fill="none" stroke="#5b6f86" stroke-width="1.6" stroke-dasharray="8,5"/>
