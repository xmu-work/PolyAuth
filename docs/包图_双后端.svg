<rect width="2400" height="1440" fill="#ffffff"/>
<text x="1200.0" y="42" text-anchor="middle" font-size="26" font-weight="bold">PolyAuth 后端包图（当前代码依赖）</text>
<defs><marker id="package-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L11,7 L2,12" fill="none" stroke="#5b6f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="package-arrow-dip" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L11,7 L2,12" fill="none" stroke="#1d6b52" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="1200.0" y="78" text-anchor="middle" font-size="14.5" font-weight="normal" fill="#526579">左侧：结构化后端按功能过程分层；右侧：OOP 后端由领域模型与输出端口隔离基础设施（依赖倒置）。</text>
<line x1="1120" y1="112" x2="1120" y2="1248" stroke="#d7e0e9" stroke-width="2"/>
<text x="595" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e8c">结构化后端 · com.polyauth.structured</text>
<text x="1645" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e8c">OOP 后端 · com.polyauth.oop</text>
