<text x="120" y="1416" text-anchor="start" font-size="14" font-weight="normal" fill="#25384d">结构化：interfaces → application → infrastructure，业务规则集中在 Service；OOP：interfaces → application → domain，infrastructure 通过端口实现并反向适配。</text>
<text x="120" y="1442" text-anchor="start" font-size="13" font-weight="normal" fill="#5a6979">依赖箭头表示编译期 import 方向；OOP 的 domain 不依赖 infrastructure，避免数据库与 JWT 实现反向侵入领域层。</text></svg>
