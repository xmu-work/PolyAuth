<text x="210" y="860" font-size="13.5" fill="#25384d">cache：Redis 权限缓存、业务锁、幂等与防重放</text>
<rect x="198" y="875" width="794" height="26" rx="4" fill="#f7fafc" stroke="#d5dee8" stroke-width="1"/>
<text x="210" y="893" font-size="13.5" fill="#25384d">crypto / logging / scheduling：加解密、切面日志与定时过期任务</text>
