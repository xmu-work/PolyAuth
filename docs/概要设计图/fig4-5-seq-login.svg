<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
  <style>text[fill="#b03030"]{paint-order:stroke;stroke:#ffffff;stroke-width:2.8px;stroke-linejoin:round}</style>
  <defs>
    <marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#222"/>
    </marker>
    <marker id="ret" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#222" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1500" height="1200" fill="#ffffff"/>

  <!-- 生命线 -->
  <rect x="20" y="70" width="180" height="60" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <text x="110" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#13396b">adminClient: 管理前台</text>
  <text x="110" y="116" text-anchor="middle" font-size="10.5" fill="#33507a">调用者</text>
  <rect x="240" y="70" width="180" height="60" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="330" y="96" text-anchor="middle" font-size="12.5" font-weight="bold">controller: AuthController</text>
  <text x="330" y="116" text-anchor="middle" font-size="10.5" fill="#555">«boundary»</text>
  <rect x="460" y="70" width="180" height="60" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <text x="550" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#13396b">auth: AuthService</text>
  <text x="550" y="116" text-anchor="middle" font-size="10.5" fill="#33507a">«service» M01</text>
  <rect x="680" y="70" width="180" height="60" fill="#fff7e0" stroke="#8a6d1d" stroke-width="1.6"/>
  <text x="770" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5c4710">crypto: CryptoComponent</text>
  <text x="770" y="116" text-anchor="middle" font-size="10.5" fill="#7a6220">«component» M09</text>
  <rect x="900" y="70" width="180" height="60" fill="#fff7e0" stroke="#8a6d1d" stroke-width="1.6"/>
  <text x="990" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5c4710">db: MySQL</text>
  <text x="990" y="116" text-anchor="middle" font-size="10.5" fill="#7a6220">iam_user / iam_token</text>
  <rect x="1120" y="70" width="180" height="60" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <text x="1210" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#13396b">logs: LogService</text>
  <text x="1210" y="116" text-anchor="middle" font-size="10.5" fill="#33507a">«service» M08</text>

  <line x1="110" y1="130" x2="110" y2="940" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="330" y1="130" x2="330" y2="940" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="550" y1="130" x2="550" y2="940" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="770" y1="130" x2="770" y2="940" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="990" y1="130" x2="990" y2="940" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="1210" y1="130" x2="1210" y2="940" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- 执行条 -->
  <rect x="105" y="210" width="10" height="720" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="325" y="210" width="10" height="715" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="545" y="255" width="10" height="630" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="985" y="300" width="10" height="45" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="765" y="380" width="10" height="40" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="985" y="600" width="10" height="40" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="985" y="690" width="10" height="40" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="1205" y="790" width="10" height="40" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>
  <rect x="555" y="520" width="10" height="28" fill="#cfdff5" stroke="#1f4e8c" stroke-width="1"/>

  <!-- 消息 -->
  <line x1="115" y1="210" x2="323" y2="210" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="219" y="200" text-anchor="middle" font-size="11" fill="#b03030">1 login(账号, 密码)</text>

  <line x1="335" y1="255" x2="543" y2="255" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="439" y="245" text-anchor="middle" font-size="11" fill="#b03030">2 login(request)</text>

  <line x1="555" y1="300" x2="983" y2="300" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="769" y="290" text-anchor="middle" font-size="11" fill="#b03030">3 findByUserNo(账号)</text>
  <line x1="985" y1="340" x2="557" y2="340" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="771" y="330" text-anchor="middle" font-size="11" fill="#b03030">返回用户与密码哈希</text>

  <line x1="555" y1="380" x2="763" y2="380" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="659" y="370" text-anchor="middle" font-size="11" fill="#b03030">4 verifyPassword(密码, 哈希)</text>
  <line x1="765" y1="415" x2="557" y2="415" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="661" y="405" text-anchor="middle" font-size="11" fill="#b03030">返回校验结果</text>

  <path d="M560,520 L600,520 L600,548 L562,548" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="516" font-size="11" fill="#b03030">5 generateToken(userId, userNo)</text>

  <line x1="555" y1="600" x2="983" y2="600" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="769" y="590" text-anchor="middle" font-size="11" fill="#b03030">6 saveToken(令牌哈希, clientIp)</text>
  <line x1="985" y1="635" x2="557" y2="635" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="771" y="625" text-anchor="middle" font-size="11" fill="#b03030">返回保存结果</text>

  <line x1="555" y1="690" x2="983" y2="690" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="769" y="680" text-anchor="middle" font-size="11" fill="#b03030">7 updateLastLoginAt(userId)</text>
  <line x1="985" y1="725" x2="557" y2="725" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="771" y="715" text-anchor="middle" font-size="11" fill="#b03030">返回更新结果</text>

  <line x1="555" y1="790" x2="1203" y2="790" stroke="#222" stroke-width="1.6" marker-end="url(#sync)"/>
  <text x="879" y="780" text-anchor="middle" font-size="11" fill="#b03030">8 recordLogin(用户, 成功)</text>
  <line x1="1205" y1="825" x2="557" y2="825" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="881" y="815" text-anchor="middle" font-size="11" fill="#b03030">返回</text>

  <line x1="545" y1="880" x2="337" y2="880" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="441" y="870" text-anchor="middle" font-size="11" fill="#b03030">9 返回 LoginResponse(令牌, 姓名)</text>

  <line x1="325" y1="925" x2="117" y2="925" stroke="#222" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ret)"/>
  <text x="221" y="915" text-anchor="middle" font-size="11" fill="#b03030">10 返回 Result(200, accessToken)</text>

  <!-- 说明 -->
  <rect x="640" y="430" width="420" height="70" fill="#fbfbfb" stroke="#999" stroke-width="1.1" stroke-dasharray="5,4"/>
  <text x="652" y="452" font-size="10.5" fill="#444">账号状态校验：SEALED → ACCOUNT_SEALED；</text>
  <text x="652" y="470" font-size="10.5" fill="#444">非 NORMAL → ACCOUNT_DISABLED；账号不存在与密码错误</text>
  <text x="652" y="488" font-size="10.5" fill="#444">统一返回 UNAUTHENTICATED（防账号枚举）。</text>

  <text x="60" y="966" font-size="11" fill="#666">说明：同步消息实线实心箭头并按序编号；返回/异常为虚线空心箭头、不编号。异常路径从 auth 的执行条直接返回 controller，不逐段传播。</text>
  <text x="60" y="986" font-size="11" fill="#666">对应需求：FR-31、FR-32、FR-34、NFR-04；对应架构故事 S2（安全）。</text>
</svg>
