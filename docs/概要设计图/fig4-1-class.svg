<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
  <style>text[fill="#b03030"]{paint-order:stroke;stroke:#ffffff;stroke-width:2.8px;stroke-linejoin:round}</style>
  <defs>
    <marker id="dep" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#1f4e8c" stroke-width="1.3"/>
    </marker>
    <marker id="assoc" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#222" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1800" height="1200" fill="#ffffff"/>

  <!-- ================= 边界类 ================= -->
  <rect x="120" y="60" width="280" height="100" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#666">«boundary»</text>
  <text x="260" y="102" text-anchor="middle" font-size="15" font-weight="bold">AuthInterceptor</text>
  <line x1="120" y1="112" x2="400" y2="112" stroke="#222"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#555">—</text>
  <line x1="120" y1="140" x2="400" y2="140" stroke="#222"/>
  <text x="130" y="157" font-size="11.5">+ preHandle(req, resp, handler): boolean</text>

  <rect x="710" y="60" width="280" height="100" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="850" y="82" text-anchor="middle" font-size="12" fill="#666">«boundary»</text>
  <text x="850" y="102" text-anchor="middle" font-size="15" font-weight="bold">OpenApiController</text>
  <line x1="710" y1="112" x2="990" y2="112" stroke="#222"/>
  <text x="850" y="132" text-anchor="middle" font-size="11" fill="#555">—</text>
  <line x1="710" y1="140" x2="990" y2="140" stroke="#222"/>
  <text x="720" y="157" font-size="11.5">+ authorize(...) / + permissions(...)</text>

  <rect x="1310" y="60" width="280" height="100" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="1450" y="82" text-anchor="middle" font-size="12" fill="#666">«boundary»</text>
  <text x="1450" y="102" text-anchor="middle" font-size="15" font-weight="bold">RoleController</text>
  <line x1="1310" y1="112" x2="1590" y2="112" stroke="#222"/>
  <text x="1450" y="132" text-anchor="middle" font-size="11" fill="#555">—</text>
  <line x1="1310" y1="140" x2="1590" y2="140" stroke="#222"/>
  <text x="1320" y="157" font-size="11.5">+ createRole(...) / + grantPermissions(...)</text>

  <!-- ================= 控制类 ================= -->
  <rect x="120" y="300" width="320" height="260" fill="#eef4fc" stroke="#1f4e8c" stroke-width="2"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#33507a">«service»</text>
  <text x="280" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#13396b">RoleService（M04）</text>
  <line x1="120" y1="356" x2="440" y2="356" stroke="#1f4e8c"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#555">—</text>
  <line x1="120" y1="386" x2="440" y2="386" stroke="#1f4e8c"/>
  <text x="132" y="408" font-size="11.5" fill="#13396b">+ createRole(code, name, type, desc): IamRole</text>
  <text x="132" y="430" font-size="11.5" fill="#13396b">+ assignRole(roleId, userId, expireTime)</text>
  <text x="132" y="452" font-size="11.5" fill="#13396b">+ revokeAssignment(roleId, userId)</text>
  <text x="132" y="474" font-size="11.5" fill="#13396b">+ grantPermissions(roleId, permIds, action)</text>
  <text x="132" y="496" font-size="11.5" fill="#13396b">+ revokePermissions(roleId, permIds)</text>
  <text x="132" y="522" font-size="11.5" fill="#13396b">+ configureExclusion(roleId, excludedRoleId)</text>
  <text x="132" y="544" font-size="11" fill="#667">（角色继承、互斥、授予校验与锁均在本类）</text>

  <rect x="740" y="300" width="330" height="280" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2.4"/>
  <text x="905" y="324" text-anchor="middle" font-size="12" fill="#33507a">«service»</text>
  <text x="905" y="347" text-anchor="middle" font-size="16" font-weight="bold" fill="#13396b">DecisionService（M07 PDP）</text>
  <line x1="740" y1="357" x2="1070" y2="357" stroke="#1f4e8c"/>
  <text x="905" y="377" text-anchor="middle" font-size="11" fill="#555">—</text>
  <line x1="740" y1="387" x2="1070" y2="387" stroke="#1f4e8c"/>
  <text x="752" y="409" font-size="11.5" fill="#13396b">+ hasPermission(userId, systemCode, permissionId): boolean</text>
  <text x="752" y="431" font-size="11.5" fill="#13396b">+ checkPermissions(userId, systemCode, ids):</text>
  <text x="764" y="449" font-size="11.5" fill="#13396b">PermissionCheckResult</text>
  <text x="752" y="471" font-size="11.5" fill="#13396b">+ getUserPermissions(userId, systemCode):</text>
  <text x="764" y="489" font-size="11.5" fill="#13396b">Set&lt;Long&gt;</text>
  <text x="752" y="516" font-size="11" fill="#667">判定链：账号正常 → 有效绑定 → 角色继承 →</text>
  <text x="752" y="534" font-size="11" fill="#667">权限覆盖 → 系统/状态过滤；只读、无状态</text>
  <text x="752" y="558" font-size="11" fill="#667">被 AuthInterceptor 与 OpenAPI 共同复用</text>

  <rect x="1330" y="300" width="350" height="260" fill="#eef4fc" stroke="#1f4e8c" stroke-width="2"/>
  <text x="1505" y="324" text-anchor="middle" font-size="12" fill="#33507a">«service»</text>
  <text x="1505" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#13396b">DataPermissionService（M06）</text>
  <line x1="1330" y1="356" x2="1680" y2="356" stroke="#1f4e8c"/>
  <text x="1505" y="376" text-anchor="middle" font-size="11" fill="#555">—</text>
  <line x1="1330" y1="386" x2="1680" y2="386" stroke="#1f4e8c"/>
  <text x="1342" y="408" font-size="11.5" fill="#13396b">+ authorize(userId, systemCode, apiId,</text>
  <text x="1354" y="426" font-size="11.5" fill="#13396b">orgId, projectId, targetUserId):</text>
  <text x="1354" y="444" font-size="11.5" fill="#13396b">ResourceDecision</text>
  <text x="1342" y="470" font-size="11.5" fill="#13396b">+ getEffectiveDataScopes(userId, systemCode):</text>
  <text x="1354" y="488" font-size="11.5" fill="#13396b">List&lt;EffectiveDataScope&gt;</text>
  <text x="1342" y="520" font-size="11" fill="#667">功能权限 ∩ 数据范围联合判定；</text>
  <text x="1342" y="538" font-size="11" fill="#667">数据范围只读计算，不修改授权事实</text>

  <!-- ================= 依赖（虚线） ================= -->
  <line x1="260" y1="160" x2="855" y2="298" stroke="#1f4e8c" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="850" y1="160" x2="895" y2="298" stroke="#1f4e8c" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="1450" y1="160" x2="450" y2="298" stroke="#1f4e8c" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#dep)"/>

  <line x1="280" y1="560" x2="620" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="300" y1="560" x2="860" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="330" y1="560" x2="1120" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>

  <line x1="870" y1="580" x2="400" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="885" y1="580" x2="660" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="905" y1="580" x2="910" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="930" y1="580" x2="1165" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="950" y1="580" x2="1425" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>

  <line x1="1470" y1="560" x2="420" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="1500" y1="560" x2="930" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="1540" y1="560" x2="1430" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <line x1="1580" y1="560" x2="1690" y2="818" stroke="#1f4e8c" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#dep)"/>

  <!-- ================= 实体类：主链 ================= -->
  <rect x="40" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="130" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="130" y="864" text-anchor="middle" font-size="15" font-weight="bold">IamOrg</text>
  <line x1="40" y1="874" x2="220" y2="874" stroke="#222"/>
  <text x="50" y="894" font-size="11">- orgName: String</text>
  <text x="50" y="914" font-size="11">- orgCode: String</text>
  <text x="50" y="934" font-size="11">- orgType: OrgType</text>
  <text x="50" y="954" font-size="11">- ancestors: String</text>
  <line x1="40" y1="964" x2="220" y2="964" stroke="#222"/>
  <text x="130" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <rect x="300" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="390" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="390" y="864" text-anchor="middle" font-size="15" font-weight="bold">IamUser</text>
  <line x1="300" y1="874" x2="480" y2="874" stroke="#222"/>
  <text x="310" y="894" font-size="11">- userNo: String</text>
  <text x="310" y="914" font-size="11">- accountStatus</text>
  <text x="310" y="934" font-size="11">- post: String</text>
  <text x="310" y="954" font-size="11">- nameEnc / phoneEnc</text>
  <line x1="300" y1="964" x2="480" y2="964" stroke="#222"/>
  <text x="390" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <rect x="560" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="650" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="650" y="864" text-anchor="middle" font-size="15" font-weight="bold">IamUserRole</text>
  <line x1="560" y1="874" x2="740" y2="874" stroke="#222"/>
  <text x="570" y="894" font-size="11">- grantedAt</text>
  <text x="570" y="914" font-size="11">- grantReason</text>
  <text x="570" y="934" font-size="11">- status: String</text>
  <text x="570" y="954" font-size="11">- expireTime</text>
  <line x1="560" y1="964" x2="740" y2="964" stroke="#222"/>
  <text x="650" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <rect x="820" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="910" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="910" y="864" text-anchor="middle" font-size="15" font-weight="bold">IamRole</text>
  <line x1="820" y1="874" x2="1000" y2="874" stroke="#222"/>
  <text x="830" y="894" font-size="11">- roleCode: String</text>
  <text x="830" y="914" font-size="11">- roleType: RoleType</text>
  <text x="830" y="934" font-size="11">- description: String</text>
  <text x="830" y="954" font-size="11">- status: String</text>
  <line x1="820" y1="964" x2="1000" y2="964" stroke="#222"/>
  <text x="910" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <rect x="1080" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="1170" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="1170" y="862" text-anchor="middle" font-size="14" font-weight="bold">IamRolePermission</text>
  <line x1="1080" y1="874" x2="1260" y2="874" stroke="#222"/>
  <text x="1090" y="894" font-size="11">- grantedAt</text>
  <text x="1090" y="914" font-size="11">- remark: String</text>
  <text x="1090" y="934" font-size="11">- allowedAction</text>
  <line x1="1080" y1="964" x2="1260" y2="964" stroke="#222"/>
  <text x="1170" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <rect x="1340" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="1430" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="1430" y="864" text-anchor="middle" font-size="15" font-weight="bold">IamPermission</text>
  <line x1="1340" y1="874" x2="1520" y2="874" stroke="#222"/>
  <text x="1350" y="894" font-size="11">- permissionCode</text>
  <text x="1350" y="914" font-size="11">- permissionType</text>
  <text x="1350" y="934" font-size="11">- action: String</text>
  <text x="1350" y="954" font-size="11">- status: String</text>
  <line x1="1340" y1="964" x2="1520" y2="964" stroke="#222"/>
  <text x="1430" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <rect x="1600" y="820" width="180" height="160" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="1690" y="842" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="1690" y="864" text-anchor="middle" font-size="15" font-weight="bold">IamApi</text>
  <line x1="1600" y1="874" x2="1780" y2="874" stroke="#222"/>
  <text x="1610" y="894" font-size="11">- apiPath: String</text>
  <text x="1610" y="914" font-size="11">- httpMethod</text>
  <text x="1610" y="934" font-size="11">- apiCode: String</text>
  <text x="1610" y="954" font-size="11">- status: String</text>
  <line x1="1600" y1="964" x2="1780" y2="964" stroke="#222"/>
  <text x="1690" y="978" text-anchor="middle" font-size="10.5" fill="#777">—</text>

  <!-- 主链关联 -->
  <line x1="220" y1="900" x2="298" y2="900" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="259" y="884" text-anchor="middle" font-size="11" fill="#b03030">所属组织</text>
  <text x="232" y="920" font-size="11" fill="#b03030">1</text>
  <text x="278" y="920" font-size="11" fill="#b03030">0..*</text>

  <line x1="480" y1="900" x2="558" y2="900" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="519" y="884" text-anchor="middle" font-size="11" fill="#b03030">角色绑定</text>
  <text x="492" y="920" font-size="11" fill="#b03030">1</text>
  <text x="530" y="920" font-size="11" fill="#b03030">0..*</text>

  <line x1="740" y1="900" x2="818" y2="900" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="780" y="884" text-anchor="middle" font-size="11" fill="#b03030">授予角色</text>
  <text x="752" y="920" font-size="11" fill="#b03030">0..*</text>
  <text x="800" y="920" font-size="11" fill="#b03030">1</text>

  <line x1="1078" y1="900" x2="1002" y2="900" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="1039" y="884" text-anchor="middle" font-size="11" fill="#b03030">权限授予</text>
  <text x="1012" y="920" font-size="11" fill="#b03030">1</text>
  <text x="1050" y="920" font-size="11" fill="#b03030">0..*</text>

  <line x1="1260" y1="900" x2="1338" y2="900" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="1300" y="884" text-anchor="middle" font-size="11" fill="#b03030">对应权限</text>
  <text x="1272" y="920" font-size="11" fill="#b03030">0..*</text>
  <text x="1318" y="920" font-size="11" fill="#b03030">1</text>

  <line x1="1598" y1="900" x2="1522" y2="900" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="1559" y="884" text-anchor="middle" font-size="11" fill="#b03030">映射 API</text>
  <text x="1532" y="920" font-size="11" fill="#b03030">1</text>
  <text x="1570" y="920" font-size="11" fill="#b03030">0..*</text>

  <!-- 角色继承自关联 -->
  <path d="M820,860 L790,860 L790,830 L818,830" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="786" y="814" text-anchor="middle" font-size="10.5" fill="#b03030">父角色 0..1</text>

  <!-- 下排实体 -->
  <rect x="690" y="1020" width="200" height="110" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="790" y="1042" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="790" y="1063" text-anchor="middle" font-size="14" font-weight="bold">IamRoleDataScope</text>
  <line x1="690" y1="1073" x2="890" y2="1073" stroke="#222"/>
  <text x="700" y="1093" font-size="11">- scopeType: String</text>
  <text x="700" y="1113" font-size="11">- expireTime</text>

  <rect x="950" y="1020" width="200" height="110" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <text x="1050" y="1042" text-anchor="middle" font-size="12" fill="#666">«entity»</text>
  <text x="1050" y="1063" text-anchor="middle" font-size="14" font-weight="bold">IamRoleExclusion</text>
  <line x1="950" y1="1073" x2="1150" y2="1073" stroke="#222"/>
  <text x="960" y="1093" font-size="11">- status: String</text>
  <text x="960" y="1113" font-size="11">- createdAt</text>

  <line x1="890" y1="980" x2="790" y2="1018" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="768" y="1002" text-anchor="end" font-size="10.5" fill="#b03030">数据范围授权</text>
  <text x="898" y="994" font-size="10.5" fill="#b03030">1</text>
  <text x="752" y="1014" font-size="10.5" fill="#b03030">0..*</text>

  <line x1="930" y1="980" x2="1030" y2="1018" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="1082" y="1002" text-anchor="start" font-size="10.5" fill="#b03030">互斥角色</text>
  <text x="942" y="994" font-size="10.5" fill="#b03030">1</text>
  <text x="1048" y="1014" font-size="10.5" fill="#b03030">0..*</text>

  <!-- 图例 -->
  <line x1="60" y1="1168" x2="120" y2="1168" stroke="#1f4e8c" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#dep)"/>
  <text x="130" y="1172" font-size="11.5" fill="#555">虚线 + 空心箭头：依赖（字段、参数或返回类型引起，线上不写文字）</text>
  <line x1="620" y1="1168" x2="680" y2="1168" stroke="#222" stroke-width="1.5" marker-end="url(#assoc)"/>
  <text x="690" y="1172" font-size="11.5" fill="#555">实线 + 空心箭头：关联（标注 role name 与多重性）</text>
  <text x="1120" y="1172" font-size="11.5" fill="#777">注：Repository 接口与实现类属详细设计；角色继承由 IamRole 左侧的父子自关联表达（父角色 0..1）</text>
</svg>
