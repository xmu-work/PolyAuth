<rect x="412" y="1168" width="28" height="24" rx="5" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<text x="452" y="1185" font-size="13" fill="#303946">六个核心业务实体</text>
<path d="M590,1180 H626" fill="none" stroke="#5b7da6" stroke-width="2"/>
<path d="M626,1180 l-8,-5 M626,1180 l-8,5" fill="none" stroke="#5b7da6" stroke-width="2"/>
<text x="638" y="1185" font-size="13" fill="#303946">自关联（层级 / 继承）</text>
<text x="802" y="1185" font-size="13" fill="#8a2b2b">1 / N / M 为参与基数</text>
<text x="975" y="1185" font-size="13" fill="#303946">鉴权链：请求 API → 所属权限 → 用户角色授予的权限；前端隐藏菜单不能替代后端 API 校验</text></svg>
