<path d="M88,240 H412 Q420,240 420,248 V288 H80 V248 Q80,240 88,240 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="96" y="262" font-size="18" font-weight="bold" fill="#173b6b">多系统</text>
<text x="96" y="281" font-size="12" fill="#49678f">iam_system</text>
<text x="96" y="312" font-size="13" fill="#202a36">PK  id</text>
<text x="96" y="336" font-size="13" fill="#202a36">UK  system_code</text>
<text x="96" y="360" font-size="13" fill="#202a36">     system_name</text>
<text x="96" y="384" font-size="13" fill="#202a36">     status / callback_url</text>
<rect x="680" y="240" width="380" height="220" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M688,240 H1052 Q1060,240 1060,248 V288 H680 V248 Q680,240 688,240 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="696" y="262" font-size="18" font-weight="bold" fill="#173b6b">权限（前端菜单/按钮树）</text>
<text x="696" y="281" font-size="12" fill="#49678f">iam_permission</text>
<text x="696" y="312" font-size="13" fill="#202a36">PK  id</text>
<text x="696" y="336" font-size="13" fill="#202a36">FK  system_id  → iam_system</text>
<text x="696" y="360" font-size="13" fill="#202a36">FK  parent_id  → iam_permission（自关联）</text>
<text x="696" y="384" font-size="13" fill="#202a36">UK  system_id + permission_code</text>
<text x="696" y="408" font-size="13" fill="#202a36">     permission_type：MENU / BUTTON</text>
<text x="696" y="432" font-size="13" fill="#202a36">     route_path / action / sort_no</text>
<rect x="1360" y="240" width="380" height="220" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
