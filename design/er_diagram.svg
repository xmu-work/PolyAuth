<text x="1376" y="262" font-size="18" font-weight="bold" fill="#173b6b">API（后端接口）</text>
<text x="1376" y="281" font-size="12" fill="#49678f">iam_api</text>
<text x="1376" y="312" font-size="13" fill="#202a36">PK  id</text>
<text x="1376" y="336" font-size="13" fill="#202a36">FK  system_id    → iam_system</text>
<text x="1376" y="360" font-size="13" fill="#202a36">FK  permission_id → iam_permission</text>
<text x="1376" y="384" font-size="13" fill="#202a36">UK  system_id + api_code</text>
<text x="1376" y="408" font-size="13" fill="#202a36">UK  api_path + http_method</text>
<text x="1376" y="432" font-size="13" fill="#202a36">     api_name / status</text>
<rect x="700" y="600" width="340" height="175" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M708,600 H1032 Q1040,600 1040,608 V648 H700 V608 Q700,600 708,600 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="716" y="622" font-size="18" font-weight="bold" fill="#173b6b">角色</text>
<text x="716" y="641" font-size="12" fill="#49678f">iam_role</text>
<text x="716" y="672" font-size="13" fill="#202a36">PK  id</text>
<text x="716" y="696" font-size="13" fill="#202a36">UK  role_code</text>
<text x="716" y="720" font-size="13" fill="#202a36">     role_name / status</text>
<text x="716" y="744" font-size="13" fill="#202a36">FK  parent_id → iam_role（角色继承，可选）</text>
<rect x="80" y="910" width="360" height="205" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M88,910 H432 Q440,910 440,918 V958 H80 V918 Q80,910 88,910 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="96" y="932" font-size="18" font-weight="bold" fill="#173b6b">分层组织部门</text>
<text x="96" y="951" font-size="12" fill="#49678f">iam_org</text>
<text x="96" y="982" font-size="13" fill="#202a36">PK  id</text>
<text x="96" y="1006" font-size="13" fill="#202a36">FK  parent_id → iam_org（自关联）</text>
<text x="96" y="1030" font-size="13" fill="#202a36">UK  org_code</text>
<text x="96" y="1054" font-size="13" fill="#202a36">     org_name / org_type / org_level</text>
<text x="96" y="1078" font-size="13" fill="#202a36">     ancestors：分层路径</text>
<rect x="690" y="915" width="360" height="195" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M698,915 H1042 Q1050,915 1050,923 V963 H690 V923 Q690,915 698,915 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="706" y="937" font-size="18" font-weight="bold" fill="#173b6b">用户</text>
<text x="706" y="956" font-size="12" fill="#49678f">iam_user</text>
<text x="706" y="987" font-size="13" fill="#202a36">PK  id</text>
<text x="706" y="1011" font-size="13" fill="#202a36">UK  user_no</text>
<text x="706" y="1035" font-size="13" fill="#202a36">FK  org_id → iam_org</text>
<text x="706" y="1059" font-size="13" fill="#202a36">     name_enc / phone_enc（加密）</text>
<text x="706" y="1083" font-size="13" fill="#202a36">     account_status / post</text>
