<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1100" height="760" fill="#ffffff"/>

  <!-- 初始伪状态 -->
  <circle cx="80" cy="370" r="10" fill="#222"/>
  <line x1="90" y1="370" x2="398" y2="370" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="240" y="358" text-anchor="middle" font-size="12" fill="#b03030">创建账号 / 分配初始角色</text>

  <!-- 状态 -->
  <rect x="400" y="140" width="240" height="90" rx="18" fill="#fff7e0" stroke="#8a6d1d" stroke-width="1.8"/>
  <text x="520" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c4710">DISABLED（停用）</text>
  <text x="520" y="202" text-anchor="middle" font-size="11.5" fill="#7a6220">管理员停用；不可登录</text>

  <rect x="400" y="320" width="240" height="100" rx="18" fill="#eef4fc" stroke="#1f4e8c" stroke-width="2"/>
  <text x="520" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#13396b">NORMAL（正常）</text>
  <text x="520" y="385" text-anchor="middle" font-size="11.5" fill="#33507a">可登录；权限按角色实时判定</text>
  <text x="520" y="404" text-anchor="middle" font-size="11" fill="#667">entry / 无</text>

  <rect x="400" y="540" width="240" height="90" rx="18" fill="#fff7e0" stroke="#8a6d1d" stroke-width="1.8"/>
  <text x="520" y="578" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c4710">LOCKED（锁定）</text>
  <text x="520" y="602" text-anchor="middle" font-size="11.5" fill="#7a6220">异常锁定；不可登录</text>

  <rect x="900" y="320" width="180" height="100" rx="18" fill="#f7e6e6" stroke="#8a2020" stroke-width="2"/>
  <text x="990" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1a1a">SEALED（封存）</text>
  <text x="990" y="384" text-anchor="middle" font-size="11.5" fill="#7a1a1a">终态；不可再迁移</text>

  <!-- 迁移 -->
  <line x1="468" y1="320" x2="468" y2="234" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="456" y="286" text-anchor="end" font-size="11.5" fill="#b03030">停用 [管理员操作]</text>
  <line x1="572" y1="230" x2="572" y2="316" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="584" y="284" font-size="11.5" fill="#b03030">启用 [管理员操作]</text>

  <line x1="468" y1="420" x2="468" y2="536" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="456" y="486" text-anchor="end" font-size="11.5" fill="#b03030">异常锁定 [安全事件]</text>
  <line x1="572" y1="540" x2="572" y2="424" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="584" y="484" font-size="11.5" fill="#b03030">解锁 [管理员操作]</text>

  <line x1="640" y1="370" x2="896" y2="370" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="768" y="358" text-anchor="middle" font-size="11.5" fill="#b03030">离职封存 / 吊销全部令牌、回收角色</text>

  <line x1="640" y1="190" x2="898" y2="334" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="770" y="240" text-anchor="middle" font-size="11.5" fill="#b03030">离职封存</text>

  <line x1="640" y1="580" x2="898" y2="406" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="770" y="520" text-anchor="middle" font-size="11.5" fill="#b03030">离职封存</text>

  <!-- 说明 -->
  <rect x="880" y="470" width="200" height="120" fill="#fbfbfb" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="892" y="492" font-size="11.5" fill="#444">守卫条件：</text>
  <text x="892" y="512" font-size="11" fill="#555">· 封存不可逆，不能再授权</text>
  <text x="892" y="530" font-size="11" fill="#555">· 仅 NORMAL 可登录</text>
  <text x="892" y="548" font-size="11" fill="#555">· 状态变更写审计日志</text>
  <text x="892" y="566" font-size="11" fill="#555">· 非 NORMAL 吊销全部令牌</text>

  <text x="70" y="700" font-size="12" fill="#555">事件来源：管理员状态变更接口 PUT /users/{userId}/status；离职封存同时解绑全部用户-角色绑定，账号与历史日志保留（FR-02、FR-05、FR-34）。</text>
  <text x="70" y="724" font-size="12" fill="#555">说明：本图为状态级设计，状态内行为与算法细节见详细设计；DISABLED / LOCKED 之间的切换必须先回到 NORMAL，不可直接互迁。</text>
</svg>
