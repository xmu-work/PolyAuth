<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
  <style>text[fill="#b03030"]{paint-order:stroke;stroke:#ffffff;stroke-width:2.8px;stroke-linejoin:round}</style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 外部实体 -->
  <rect x="60" y="300" width="200" height="90" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="160" y="337" text-anchor="middle" font-size="15" font-weight="bold">E1 普通员工</text>
  <text x="160" y="360" text-anchor="middle" font-size="11.5" fill="#555">登录、查询本人权限</text>

  <rect x="490" y="70" width="220" height="90" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="600" y="107" text-anchor="middle" font-size="15" font-weight="bold">E2 管理员</text>
  <text x="600" y="130" text-anchor="middle" font-size="11.5" fill="#555">账号 / 组织 / 授权 / 日志</text>

  <rect x="940" y="300" width="200" height="90" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="1040" y="337" text-anchor="middle" font-size="15" font-weight="bold">E3 18 套业务系统</text>
  <text x="1040" y="360" text-anchor="middle" font-size="11.5" fill="#555">令牌校验与 API 鉴权</text>

  <rect x="490" y="640" width="220" height="90" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text x="600" y="677" text-anchor="middle" font-size="15" font-weight="bold">E4 HR 人力资源系统</text>
  <text x="600" y="700" text-anchor="middle" font-size="11.5" fill="#555">人事事件源</text>

  <!-- 系统加工 -->
  <rect x="430" y="310" width="340" height="150" rx="20" fill="#e8f1fc" stroke="#1f4e8c" stroke-width="2"/>
  <text x="600" y="350" text-anchor="middle" font-size="13" fill="#33507a">P0</text>
  <text x="600" y="382" text-anchor="middle" font-size="18" font-weight="bold" fill="#13396b">统一应用权限平台</text>
  <text x="600" y="408" text-anchor="middle" font-size="12" fill="#33507a">RBAC 统一身份与权限平台</text>
  <text x="600" y="432" text-anchor="middle" font-size="11" fill="#667">认证 · 授权 · 决策 · 审计</text>

  <!-- E1 ↔ P0 -->
  <line x1="260" y1="330" x2="428" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="316" text-anchor="middle" font-size="11" fill="#b03030">登录凭证、权限查询</text>
  <line x1="428" y1="380" x2="260" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="402" text-anchor="middle" font-size="11" fill="#b03030">令牌、权限集合</text>

  <!-- E2 ↔ P0 -->
  <line x1="560" y1="160" x2="560" y2="308" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="572" y="245" font-size="11" fill="#b03030">账号 / 组织 / 角色 / 授权 / 日志查询指令</text>
  <line x1="640" y1="310" x2="640" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="652" y="225" font-size="11" fill="#b03030">操作结果、配置结果、日志查询结果</text>

  <!-- E3 ↔ P0 -->
  <line x1="940" y1="330" x2="772" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="856" y="318" text-anchor="middle" font-size="11" fill="#b03030">鉴权请求（令牌 + API）</text>
  <line x1="772" y1="380" x2="940" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="856" y="404" text-anchor="middle" font-size="11" fill="#b03030">鉴权结果 / 权限集合</text>

  <!-- E4 → P0 -->
  <line x1="600" y1="640" x2="600" y2="462" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="612" y="560" font-size="11" fill="#b03030">人事事件（入职 / 调岗 / 离职）</text>

  <text x="60" y="770" font-size="11.5" fill="#666">说明：0 层图只表达系统边界与外部数据流；本图中每条外部数据流在 4.3 节第一层图中都有同名对应流（父子平衡）。</text>
</svg>
