<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1200" height="920" fill="#ffffff"/>

  <!-- web -->
  <rect x="410" y="86" width="290" height="66" fill="#f7f7f7" stroke="#222" stroke-width="1.6"/>
  <rect x="410" y="72" width="120" height="16" fill="#f7f7f7" stroke="#222" stroke-width="1.6"/>
  <text x="470" y="84.5" text-anchor="middle" font-size="11" fill="#111">«package»</text>
  <text x="555" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">web（Vue 3 管理后台）</text>
  <text x="555" y="141" text-anchor="middle" font-size="11.5" fill="#555">views · api · store · directives</text>

  <!-- 主包 -->
  <rect x="60" y="210" width="900" height="660" fill="#fbfcfe" stroke="#1f4e8c" stroke-width="1.8"/>
  <rect x="60" y="194" width="200" height="16" fill="#fbfcfe" stroke="#1f4e8c" stroke-width="1.8"/>
  <text x="160" y="206.5" text-anchor="middle" font-size="11" fill="#13396b">«package»</text>
  <text x="80" y="238" font-size="15" font-weight="bold" fill="#13396b">com.iam.platform</text>

  <!-- interfaces -->
  <rect x="90" y="260" width="840" height="140" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <rect x="90" y="246" width="120" height="14" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <text x="150" y="257" text-anchor="middle" font-size="10" fill="#13396b">«package»</text>
  <text x="108" y="284" font-size="15" font-weight="bold" fill="#13396b">interfaces（接口层）</text>
  <text x="108" y="308" font-size="12" fill="#33507a">admin：Auth / User / Role / System / Permission / Api / Organization / Log Controller</text>
  <text x="108" y="330" font-size="12" fill="#33507a">openapi：OpenApiController</text>
  <text x="108" y="352" font-size="12" fill="#33507a">filter：RequestIdFilter、AuthInterceptor、OpenApiAuthInterceptor、IdempotencyFilter</text>
  <text x="108" y="374" font-size="12" fill="#33507a">advice：GlobalExceptionHandler、ResultRequestIdAdvice</text>

  <!-- application -->
  <rect x="90" y="430" width="840" height="140" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <rect x="90" y="416" width="120" height="14" fill="#eef4fc" stroke="#1f4e8c" stroke-width="1.6"/>
  <text x="150" y="427" text-anchor="middle" font-size="10" fill="#13396b">«package»</text>
  <text x="108" y="454" font-size="15" font-weight="bold" fill="#13396b">application（应用层）</text>
  <text x="108" y="478" font-size="12" fill="#33507a">auth（M01）· account（M02）· organization（M03）· role（M04）</text>
  <text x="108" y="500" font-size="12" fill="#33507a">system / permission / api（M05）· datascope（M06）· decision（M07）· log（M08）</text>
  <text x="108" y="522" font-size="12" fill="#33507a">openapi（接入方签名与防重放）· expiration（授权到期）· idempotency（幂等）</text>
  <text x="108" y="544" font-size="11.5" fill="#667">业务规则、事务边界与权限守卫集中在本层；Controller 不写业务逻辑</text>

  <!-- infrastructure -->
  <rect x="90" y="600" width="840" height="140" fill="#fff7e0" stroke="#8a6d1d" stroke-width="1.6"/>
  <rect x="90" y="586" width="120" height="14" fill="#fff7e0" stroke="#8a6d1d" stroke-width="1.6"/>
  <text x="150" y="597" text-anchor="middle" font-size="10" fill="#5c4710">«package»</text>
  <text x="108" y="624" font-size="15" font-weight="bold" fill="#5c4710">infrastructure（基础设施层）</text>
  <text x="108" y="648" font-size="12" fill="#5c4710">persistence.entity（13 个 JPA 实体）· persistence.repository（12 个仓储接口）</text>
  <text x="108" y="670" font-size="12" fill="#5c4710">cache：PermissionCacheComponent、BusinessLockExecutor、RedisIdempotencyStore、RedisReplayGuard</text>
  <text x="108" y="692" font-size="12" fill="#5c4710">crypto：CryptoComponent（AES-GCM / PBKDF2 / HMAC）</text>
  <text x="108" y="714" font-size="12" fill="#5c4710">logging：LayerLoggingAspect　scheduling：GrantExpirationScheduler</text>

  <!-- common -->
  <rect x="990" y="300" width="170" height="310" fill="#f7f7f7" stroke="#555" stroke-width="1.6"/>
  <rect x="990" y="286" width="120" height="14" fill="#f7f7f7" stroke="#555" stroke-width="1.6"/>
  <text x="1050" y="297" text-anchor="middle" font-size="10" fill="#333">«package»</text>
  <text x="1008" y="324" font-size="15" font-weight="bold" fill="#333">common</text>
  <text x="1008" y="350" font-size="12" fill="#444">result：</text>
  <text x="1008" y="368" font-size="11.5" fill="#555">Result、PageResult</text>
  <text x="1008" y="396" font-size="12" fill="#444">exception：</text>
  <text x="1008" y="414" font-size="11.5" fill="#555">BusinessException</text>
  <text x="1008" y="432" font-size="11.5" fill="#555">GlobalExceptionHandler</text>
  <text x="1008" y="460" font-size="12" fill="#444">enums：</text>
  <text x="1008" y="478" font-size="11.5" fill="#555">AccountStatus</text>
  <text x="1008" y="496" font-size="11.5" fill="#555">OperationAction</text>
  <text x="1008" y="514" font-size="11.5" fill="#555">OrgType / RoleType</text>
  <text x="1008" y="532" font-size="11.5" fill="#555">ErrorCode</text>
  <text x="1008" y="566" font-size="11" fill="#666">被三层共同使用</text>

  <!-- 依赖箭头 -->
  <line x1="555" y1="152" x2="555" y2="258" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="566" y="205" font-size="11.5" fill="#666">HTTP / JSON</text>

  <line x1="510" y1="400" x2="510" y2="428" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="510" y1="570" x2="510" y2="598" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="930" y1="330" x2="988" y2="350" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <line x1="930" y1="500" x2="988" y2="460" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <line x1="930" y1="670" x2="988" y2="565" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>

  <!-- 图例 -->
  <line x1="80" y1="896" x2="130" y2="896" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="140" y="900" font-size="11.5" fill="#555">实线：编译期依赖</text>
  <line x1="290" y1="896" x2="340" y2="896" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <text x="350" y="900" font-size="11.5" fill="#555">虚线：使用（依赖）</text>
  <text x="560" y="900" font-size="11.5" fill="#555">依赖方向：interfaces → application → infrastructure；各层均可使用 common</text>
</svg>
